name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MONANDROIDO_DEV_WALLET: REPLACE_WITH_YOUR_XMR_WALLET

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Validate with Gradle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: monandroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: monandroid-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload release mapping
        uses: actions/upload-artifact@v7
        with:
          name: monandroid-release-mapping
          path: app/build/outputs/mapping/release/
